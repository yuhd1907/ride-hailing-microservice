server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: driver-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://driver_postgres:5432/driver_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000

# Cấu hình hết hạn vị trí và giữ chỗ tài xế (giây)
driver:
  location:
    max-age-seconds: ${DRIVER_LOCATION_MAX_AGE_SECONDS:300}
  reservation:
    timeout-seconds: ${DRIVER_RESERVATION_TIMEOUT_SECONDS:60}
    cleanup-interval-ms: ${DRIVER_RESERVATION_CLEANUP_INTERVAL_MS:5000}

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${EUREKA_INSTANCE_INSTANCE_ID:driver-service-${random.uuid}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# Actuator
management:
  # Metrics cho Prometheus/Grafana: gắn tên service vào mọi metric và xuất histogram
  # thời gian xử lý request để tính p95.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing: mọi request/message tạo span và gửi sang Zipkin.
  # correlationId được gắn làm tag của span (xem TracingConfig) để tìm trace theo ID trong log.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
