server:
  port: ${SERVER_PORT:8086}
  # Luôn trả Content-Type kèm charset=UTF-8 để client (PowerShell 5, trình duyệt cũ) đọc đúng tiếng Việt
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: notification-service
  # Defaults are for running locally (IDE) against the databases published by deploy/docker-compose.yml.
  # Inside docker-compose these are overridden by environment variables.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    # Dead-letter replay waits for the broker to confirm each copied message
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: ${NOTIFICATION_LISTENER_CONCURRENCY:2}
        max-concurrency: ${NOTIFICATION_LISTENER_CONCURRENCY:2}
        prefetch: 10
        # A message that still fails after the retries is rejected into the dead-letter queue
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Resolved once from fixed values (not random) so logs and Eureka show the same id
    instance-id: ${EUREKA_INSTANCE_INSTANCE_ID:${spring.application.name}:${HOSTNAME:local}:${server.port}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# Actuator
management:
  # Metrics cho Prometheus/Grafana: gắn tên service vào mọi metric và xuất histogram
  # thời gian xử lý request để tính p95.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing: mọi request/message tạo span và gửi sang Zipkin.
  # correlationId được gắn làm tag của span (xem TracingConfig) để tìm trace theo ID trong log.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
