# Gradle (va plugin spring-javaformat chay ben trong no) doc/ghi ma nguon bang UTF-8 tren moi may.
# Thieu dong nay, Gradle tren Windows dung bang ma mac dinh cua he thong (vd windows-1258),
# nen cac file co chu thich tieng Viet bi format/checkFormat khac nhau giua cac may.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
