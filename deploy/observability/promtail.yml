# Promtail doc log cua moi container trong project Compose nay qua Docker socket
# va day ve Loki. Log JSON duoc tach truong level lam nhan; correlationId khong lam
# nhan (qua nhieu gia tri) ma loc bang: {service="trip_service"} | json | correlationId="..."
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=ride-hailing-microservice"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
      - template:
          source: level
          template: "{{ ToLower .Value }}"
      - labels:
          level:
