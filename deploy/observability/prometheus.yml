# Prometheus tu tim cac instance dang dang ky tren Eureka (ke ca instance thu 2 cua
# driver-service), nen khong phai khai bao dia chi tung service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Service Spring Boot: metrics tai /actuator/prometheus
  - job_name: java-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_eureka_app_name]
        target_label: service
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
      - source_labels: [__meta_eureka_app_name]
        regex: (API-GATEWAY|USER-SERVICE|DRIVER-SERVICE|PAYMENT-SERVICE|NOTIFICATION-SERVICE)
        action: keep

  # Service Node.js (Trip, Matching): metrics tai /metrics
  - job_name: node-services
    metrics_path: /metrics
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_eureka_app_name]
        target_label: service
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
      - source_labels: [__meta_eureka_app_name]
        regex: (TRIP-SERVICE|MATCHING-SERVICE)
        action: keep
