name: ride-hailing-microservice

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks:
    - ride-hailing-net
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  eureka_server:
    build: ./eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user_postgres:
    <<: *postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-postgres_password}
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    volumes:
      - user_pg_data:/var/lib/postgresql/data
      - ./user-service/src/main/resources/db/migration/V1__init_user.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  driver_postgres:
    <<: *postgres
    environment:
      POSTGRES_DB: ${DRIVER_DB_NAME:-driver_db}
      POSTGRES_USER: ${DRIVER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD:-postgres_password}
    ports:
      - "${DRIVER_DB_PORT:-5434}:5432"
    volumes:
      - driver_pg_data:/var/lib/postgresql/data
      - ./driver-service/src/main/resources/db/migration/V1__init_driver.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  trip_postgres:
    <<: *postgres
    profiles: [extended]
    environment:
      POSTGRES_DB: ${TRIP_DB_NAME:-trip_db}
      POSTGRES_USER: ${TRIP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:-postgres_password}
    ports:
      - "${TRIP_DB_PORT:-5435}:5432"
    volumes:
      - trip_pg_data:/var/lib/postgresql/data

  matching_postgres:
    <<: *postgres
    profiles: [extended]
    environment:
      POSTGRES_DB: ${MATCHING_DB_NAME:-matching_db}
      POSTGRES_USER: ${MATCHING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-postgres_password}
    ports:
      - "${MATCHING_DB_PORT:-5436}:5432"
    volumes:
      - matching_pg_data:/var/lib/postgresql/data

  payment_postgres:
    <<: *postgres
    profiles: [extended]
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-postgres_password}
    ports:
      - "${PAYMENT_DB_PORT:-5437}:5432"
    volumes:
      - payment_pg_data:/var/lib/postgresql/data

  notification_postgres:
    <<: *postgres
    profiles: [extended]
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-postgres_password}
    ports:
      - "${NOTIFICATION_DB_PORT:-5438}:5432"
    volumes:
      - notification_pg_data:/var/lib/postgresql/data

  api_gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      eureka_server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user_service:
    build: ./user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://user_postgres:5432/${USER_DB_NAME:-user_db}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-postgres_password}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      eureka_server:
        condition: service_healthy
      user_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  driver_service_1: &driver-service
    build: ./driver-service
    restart: unless-stopped
    ports:
      - "${DRIVER_SERVICE_PORT_1:-8082}:8082"
    environment: &driver-environment
      SERVER_PORT: 8082
      EUREKA_INSTANCE_INSTANCE_ID: driver-service-instance-1
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://driver_postgres:5432/${DRIVER_DB_NAME:-driver_db}
      SPRING_DATASOURCE_USERNAME: ${DRIVER_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DRIVER_DB_PASSWORD:-postgres_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
    depends_on:
      eureka_server:
        condition: service_healthy
      driver_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ride-hailing-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  driver_service_2:
    <<: *driver-service
    profiles: [scale]
    ports:
      - "${DRIVER_SERVICE_PORT_2:-18082}:8082"
    environment:
      <<: *driver-environment
      EUREKA_INSTANCE_INSTANCE_ID: driver-service-instance-2

networks:
  ride-hailing-net:
    driver: bridge

volumes:
  user_pg_data:
  driver_pg_data:
  trip_pg_data:
  matching_pg_data:
  payment_pg_data:
  notification_pg_data:
  redis_data:
